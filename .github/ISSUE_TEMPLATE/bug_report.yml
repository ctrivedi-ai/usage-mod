name: Bug report
description: Something in usage-mod is wrong or broken.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, don't use this form: see SECURITY.md and report it privately.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: The steps that lead to the problem.
      placeholder: |
        1. Open the Usage pane
        2. Switch to History
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Session tab
        - Live tab
        - History tab
        - Status line
        - Header badge
        - Slash command (/usage-budget, /usage-export, /usage-status, /usage-pane)
        - Install or update
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: usage-mod version
      description: From CHANGELOG.md or the plugin list.
      placeholder: "0.9.11"
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Where you run Claude Code
      options:
        - Terminal (CLI)
        - Desktop app
        - IDE extension
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, macOS 15, Ubuntu 24.04..."
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: A screenshot of the pane helps a lot. Please hide anything private first.
